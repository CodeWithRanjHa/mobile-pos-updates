name: Publish verified Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version from the successful private Windows build
        required: true
      artifact_url:
        description: Temporary download URL for the verified release artifact only
        required: true
      artifact_sha256:
        description: SHA256 reported by GitHub for the successful build artifact
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and verify the selected build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import os, re, json, base64, hashlib, zipfile, pathlib, subprocess, urllib.request
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'[1-9]\d*\.\d+\.\d+', version), 'Invalid stable version'
          url = os.environ['ARTIFACT_URL']
          assert url.startswith('https://'), 'HTTPS required'
          print('::add-mask::' + url)
          urllib.request.urlretrieve(url, '/tmp/release-artifact.zip')
          digest = hashlib.file_digest(open('/tmp/release-artifact.zip', 'rb'), 'sha256').hexdigest()
          assert digest == os.environ['ARTIFACT_SHA256'].removeprefix('sha256:'), 'Artifact checksum mismatch'
          out = pathlib.Path('verified-release'); out.mkdir()
          names = {'ApexMobilePos-Setup.exe', f'ApexMobilePos-{version}-full.nupkg', f'ApexMobilePos-{version}-win-full.nupkg', 'latest.json', 'releases.win.json'}
          with zipfile.ZipFile('/tmp/release-artifact.zip') as archive:
              for member in archive.infolist():
                  assert member.filename in names, 'Unexpected artifact file'
                  archive.extract(member, out)
          envelope = json.loads((out / 'latest.json').read_text())
          payload = base64.b64decode(envelope['Payload'], validate=True)
          pathlib.Path('/tmp/payload').write_bytes(payload)
          pathlib.Path('/tmp/signature').write_bytes(base64.b64decode(envelope['Signature'], validate=True))
          subprocess.run(['openssl', 'dgst', '-sha256', '-verify', '.github/release-signing-public.pem', '-signature', '/tmp/signature', '/tmp/payload'], check=True)
          manifest = json.loads(payload)
          assert manifest['Schema'] == 1 and manifest['Version'] == version
          assets = json.loads(manifest['FeedJson'])['Assets']; assert len(assets) == 1
          asset = assets[0]
          assert asset['PackageId'] == 'ApexMobilePos' and asset['Version'] == version and asset['Type'] == 'Full'
          assert asset['FileName'] in {f'ApexMobilePos-{version}-full.nupkg', f'ApexMobilePos-{version}-win-full.nupkg'}
          package = out / asset['FileName']
          assert package.stat().st_size == asset['Size']
          assert hashlib.file_digest(package.open('rb'), 'sha256').hexdigest().lower() == asset['SHA256'].lower()
          with zipfile.ZipFile(package) as archive:
              assert not any(re.search(r'\.(db|db-wal|db-shm|lic|pem)$|private_key', entry.filename, re.I) for entry in archive.infolist()), 'Client data/key file in package'
          print('PASS: build artifact, production signature and package checksum verified.')
          PY
      - name: Publish binaries, then advance the signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" verified-release/* --repo "$GITHUB_REPOSITORY" --title "Apex Mobile POS $RELEASE_VERSION" --notes 'Install Windows Setup once to enable in-app updates. Future updates appear in Settings. Existing shop data remains under the same Windows user profile.' --latest
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          endpoint = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/latest.json"
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'MobilePos-Release-Publisher'}
          body = {'message': 'Publish signed update feed ' + os.environ['RELEASE_VERSION'], 'content': base64.b64encode(open('verified-release/latest.json', 'rb').read()).decode(), 'branch': 'main'}
          try:
              existing = json.load(urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers)))
              body['sha'] = existing['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
          request = urllib.request.Request(endpoint, data=json.dumps(body).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(request) as response: assert response.status in (200, 201)
          print('Published binaries and signed feed.')
          PY
